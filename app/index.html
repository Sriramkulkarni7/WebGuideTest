<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>ShopLite</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <h1>ShopLite</h1>
    <search class="search">
      <label for="search-input">Search products</label>
      <input type="search" id="search-input" name="q" autocomplete="off" enterkeyhint="search" placeholder="e.g. lamp">
    </search>
    <button type="button" class="cart-button" id="open-cart" command="show-modal" commandfor="cart" aria-describedby="cart-summary">
      Cart <span id="cart-count" class="badge">0</span>
    </button>
    <p id="cart-summary" class="visually-hidden" aria-live="polite">0 items, ₹0</p>
  </header>

  <main>
    <section aria-labelledby="products-title">
      <h2 id="products-title">Products</h2>
      <p id="no-results" hidden>No products match your search.</p>
      <ul class="product-grid" id="product-grid" role="list"></ul>
    </section>
  </main>

  <template id="product-card-template">
    <li>
      <article class="card">
        <img src="" alt="" width="400" height="300">
        <h3></h3>
        <p class="price"></p>
        <footer>
          <button type="button" class="quick-view">Quick view</button>
          <button type="button" class="add-to-cart">Add to cart</button>
        </footer>
      </article>
    </li>
  </template>

  <!-- Quick view: native modal dialog, opened with showModal() -->
  <dialog id="quick-view" closedby="any" aria-labelledby="qv-title">
    <article class="quick-view-body">
      <img id="qv-image" src="" alt="" width="400" height="300" fetchpriority="low">
      <h2 id="qv-title"></h2>
      <p id="qv-description"></p>
      <p id="qv-price" class="price"></p>
      <form method="dialog" class="dialog-actions">
        <button value="close" autofocus>Close</button>
        <button value="add" class="primary">Add to cart</button>
      </form>
    </article>
  </dialog>

  <!-- Cart -->
  <dialog id="cart" closedby="any" aria-labelledby="cart-title">
    <h2 id="cart-title">Your cart</h2>
    <p id="cart-empty">Your cart is empty.</p>
    <ul id="cart-items" class="cart-items" role="list"></ul>
    <p class="cart-total">Total: <output id="cart-total">₹0</output></p>
    <form method="dialog" class="dialog-actions">
      <button value="close" autofocus>Keep shopping</button>
      <button value="checkout" class="primary" id="go-checkout">Proceed to checkout</button>
    </form>
  </dialog>

  <!-- Checkout -->
  <dialog id="checkout" aria-labelledby="checkout-title">
    <h2 id="checkout-title">Checkout</h2>
    <form id="checkout-form" class="checkout-form">
      <fieldset>
        <legend>Delivery</legend>
        <label for="fullname">Full name</label>
        <input type="text" id="fullname" name="fullname" autocomplete="shipping name" required autofocus>

        <label for="address">Address</label>
        <textarea id="address" name="address" autocomplete="shipping street-address" rows="3" required></textarea>

        <label for="postal-code">PIN code</label>
        <input type="text" id="postal-code" name="postal-code" autocomplete="shipping postal-code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required>
      </fieldset>

      <fieldset>
        <legend>Payment</legend>
        <label for="cc-name">Name on card</label>
        <input type="text" id="cc-name" name="cc-name" autocomplete="cc-name" maxlength="50" required>

        <label for="cc-number">Card number</label>
        <input type="text" id="cc-number" name="cc-number" autocomplete="cc-number" inputmode="numeric" pattern="[\d ]{13,19}" maxlength="19" required>

        <label for="cc-exp">Expiry date</label>
        <span id="exp-hint" class="hint">Format: MM/YY</span>
        <input type="text" id="cc-exp" name="cc-exp" autocomplete="cc-exp" aria-describedby="exp-hint" pattern="(0[1-9]|1[0-2])/[0-9]{2}" maxlength="5" required>

        <label for="cc-csc">Security code</label>
        <input type="text" id="cc-csc" name="cc-csc" autocomplete="cc-csc" inputmode="numeric" pattern="[0-9]{3,4}" maxlength="4" enterkeyhint="done" required>
      </fieldset>

      <p class="cart-total">Amount to pay: <output id="checkout-total">₹0</output></p>
      <div class="dialog-actions">
        <button type="button" id="cancel-checkout">Cancel</button>
        <button type="submit" class="primary">Place order</button>
      </div>
    </form>
  </dialog>

  <p id="toast" class="toast" role="status" aria-live="polite"></p>
</body>
</html>
